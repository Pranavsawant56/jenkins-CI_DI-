<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form</title>

    <style>
        /* ---------- Page ---------- */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
            color: #1f2937;
            background: #eef2f7;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 1.8rem;
            font-weight: 700;
            color: #111827;
            text-align: center;
        }

        /* ---------- Form card ---------- */
        form {
            width: 100%;
            max-width: 440px;
            padding: 28px;
            background: #ffffff;
            border: 1px solid #dde3ec;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            margin-bottom: 18px;
            padding: 11px 12px;
            font: inherit;
            color: inherit;
            background: #e4330bbc;
            border: 1px solid #c8d0dc;
            border-radius: 8px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            background: #ffffff;
            border-color: #800e0e;
            box-shadow: 0 0 0 3px rgba(157, 19, 19, 0.2);
        }

        /* ---------- Button ---------- */
        button {
            width: 100%;
            padding: 12px;
            font: inherit;
            font-weight: 600;
            color: #ffffff;
            background: #2563eb;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }

        button:hover {
            background: #090c13;
        }

        button:focus-visible {
            outline: 3px solid rgba(20, 23, 29, 0.4);
            outline-offset: 2px;
        }
    </style>
</head>

<body>

    <h1>Registration Form</h1>

    <form action="/submit" method="POST">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit">Submit</button>

    </form>

</body>

</html>
